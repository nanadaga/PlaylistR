<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaylistR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🎵 PlaylistR</div>

        <nav>
            <button onclick="showPage('home')">Home</button>
            <button onclick="showPage('profile')">My Profile</button>
            <button onclick="showPage('create')">+ New Post</button>
        </nav>
    </header>


    <!-- HOME -->
    <main id="home" class="page">

        <section class="hero">
            <h1>Discover great playlists.</h1>
            <p>Share your Spotify playlists and let your friends rate them.</p>

            <button class="main-button" onclick="showPage('create')">
                Share a Playlist
            </button>
        </section>

        <section>
            <h2>🎵 Recent Playlists</h2>
            <div id="playlistContainer"></div>
        </section>

    </main>


    <!-- PROFILE -->
    <main id="profile" class="page hidden">

        <div class="profile-card">

            <div class="avatar" id="profileAvatar">👤</div>

            <h1 id="profileName">Your Name</h1>

            <p id="profileBio">Your bio goes here.</p>

            <button onclick="editProfile()">Edit Profile</button>

        </div>

        <h2>My Playlists</h2>

        <div id="myPlaylists"></div>

    </main>


    <!-- CREATE POST -->
    <main id="create" class="page hidden">

        <div class="form-card">

            <h1>🎵 Create Playlist Post</h1>

            <label>Playlist Title</label>
            <input
                id="playlistTitle"
                type="text"
                placeholder="e.g. Late Night Drives"
            >

            <label>Spotify Playlist Link</label>
            <input
                id="playlistLink"
                type="url"
                placeholder="Paste your Spotify playlist link"
            >

            <label>Description</label>
            <textarea
                id="playlistDescription"
                placeholder="Tell people about your playlist..."
            ></textarea>

            <button class="main-button" onclick="createPost()">
                Post Playlist
            </button>

        </div>

    </main>


    <!-- EDIT PROFILE -->
    <div id="profileModal" class="modal hidden">

        <div class="modal-content">

            <h2>Edit Profile</h2>

            <input
                id="newName"
                placeholder="Username"
            >

            <input
                id="newAvatar"
                placeholder="Avatar emoji (e.g. 😎)"
            >

            <textarea
                id="newBio"
                placeholder="Short bio"
            ></textarea>

            <button class="main-button" onclick="saveProfile()">
                Save
            </button>

            <button onclick="closeModal()">
                Cancel
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
